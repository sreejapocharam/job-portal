<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <main>
        <h1>Register</h1>
        <form id="registerform">
            <label for="registername">Name:</label>
            <input type="text" id="registername" placeholder="Enter your name">
            <label for="registeremail">Email:</label>
            <input type="email" id="registeremail" placeholder="Enter your mail">
            <label for="registerpassword">Password:</label>
            <input type="password" id="registerpassword" placeholder="Enter your password">
            <label for="confirmpassword">Confirm Password:</label>
            <input type="password" id="confirmpassword" placeholder="Re-enter your password">
        <button type="submit">Register</button>
       </form>
       <p id="message"></p>
    </main>
    <script src="register.js"></script> 
</body>
</html>
